<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE14D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>IRON LOG</title>
<style>
:root{--y:#FFE14D;--p:#FF6B9D;--g:#7CFFB2;--b:#8EC5FF;--k:#111;--w:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:"Arial Black",system-ui,sans-serif;background:var(--y);color:var(--k);padding:env(safe-area-inset-top) 0 0}
header{padding:14px 16px;font-size:26px;letter-spacing:-1px;border-bottom:4px solid var(--k);background:var(--w)}
main{padding:14px 14px 110px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--w);border-top:4px solid var(--k);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;font:inherit;font-size:12px;border:0;border-right:3px solid var(--k);background:var(--w)}
nav button:last-child{border:0}nav button.on{background:var(--p)}
.c{background:var(--w);border:4px solid var(--k);box-shadow:6px 6px 0 var(--k);padding:12px;margin-bottom:18px}
h2{font-size:18px;text-transform:uppercase;margin-bottom:8px}
.big{font-size:30px}.sm{font-size:12px;font-family:system-ui;font-weight:600;opacity:.8}
button,select,input,textarea{font:inherit;font-family:system-ui;font-weight:700;border:3px solid var(--k);padding:9px;background:var(--w);color:var(--k);border-radius:0}
.btn{background:var(--g);box-shadow:3px 3px 0 var(--k);cursor:pointer;margin:3px 3px 3px 0}
.btn:active{transform:translate(3px,3px);box-shadow:none}.pk{background:var(--p)}.bl{background:var(--b)}
input,select,textarea{width:100%;margin:3px 0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .c{margin:0;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border:3px solid var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:#eee}
.cal .h{border:0;aspect-ratio:auto;background:none;font-size:11px}
.cal .g{background:var(--g)}.cal .m{background:var(--p)}.cal .t{outline:4px solid var(--k)}.cal .e{border:0;background:none}
.lg span{display:inline-block;margin-right:10px;font-size:12px;font-family:system-ui}
.bar{height:18px;border:3px solid var(--k);background:#eee}.bar i{display:block;height:100%;background:var(--g)}
.set{display:grid;grid-template-columns:22px 1fr 1fr 1.2fr 44px;gap:4px;align-items:center;margin:4px 0}
.set input,.set select{padding:6px;margin:0}.done{background:var(--g)!important}
canvas{width:100%;height:180px;border:3px solid var(--k);display:block;margin-bottom:8px}
.hr{display:flex;justify-content:space-between;border-bottom:2px dashed var(--k);padding:6px 0;font-size:14px}
.days label{display:inline-block;margin:2px;font-size:12px}.days input{width:auto}
</style></head><body>
<header>🏋️ IRON LOG</header><main id="v"></main>
<nav id="n"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let db,D={r:[],s:[],m:[],t:[]},B={},tab='home',cm=0,sel=ymd(new Date()),md=ymd(new Date()),sx='';
const op=()=>new Promise(r=>{const q=indexedDB.open('fit',1);q.onupgradeneeded=()=>{for(const n of['r','s','m','t','k'])q.result.createObjectStore(n,{keyPath:n=='t'?'d':n=='k'?'key':'id'})};q.onsuccess=()=>r(q.result)});
const tx=(n,m,f)=>new Promise(r=>{const t=db.transaction(n,m),o=f(t.objectStore(n));t.oncomplete=()=>r(o.result)});
const put=(n,o)=>tx(n,'readwrite',s=>s.put(o)),rm=(n,k)=>tx(n,'readwrite',s=>s.delete(k)),all=n=>tx(n,'readonly',s=>s.getAll());
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ST={sick:'🤒',drained:'😮‍💨',busy:'📅',injured:'🩹',travel:'✈️',other:'💬'},BARS=['Normal','Heavier','Lighter','Other'];
const ended=()=>D.s.filter(s=>s.end).sort((a,b)=>b.start-a.start);
const act=()=>D.s.find(s=>!s.end);
async function load(){for(const n of['r','s','m','t'])D[n]=await all(n);B=(await all('k')).find(x=>x.key=='body')||{key:'body'}}
function lastFor(n){for(const s of ended()){const e=s.ex.find(e=>e.n==n&&e.sets.some(x=>x.d));if(e)return e.sets.filter(x=>x.d)}return[]}
function mk(n,c){const l=lastFor(n);return(l.length?l:Array.from({length:c||3},()=>({}))).map(x=>({w:x.w??'',r:x.r??'',b:x.b||'Normal',d:false,p:x.w!==undefined?x.w+'×'+x.r:''}))}
function miss(){const ms=new Set(),td=ymd(new Date());if(!D.r.length)return ms;
const st=ymd(Math.min(...D.r.map(r=>r.c))),gym=new Set(ended().map(s=>ymd(s.start)));
for(let x=pd(st);ymd(x)<td;x.setDate(x.getDate()+1)){const k=ymd(x);if(!gym.has(k)&&D.r.some(r=>r.mode=='days'&&r.days.includes(x.getDay())))ms.add(k)}
const tg=D.r.filter(r=>r.mode=='week').reduce((a,r)=>a+r.n,0);
if(tg){const w=pd(st);w.setDate(w.getDate()-((w.getDay()+6)%7));
for(;;w.setDate(w.getDate()+7)){const days=[];for(let i=0;i<7;i++){const x=new Date(w);x.setDate(x.getDate()+i);days.push(ymd(x))}
if(days[6]>=td)break;let sf=tg-days.filter(k=>gym.has(k)).length;
for(let i=6;i>=0&&sf>0;i--)if(days[i]>=st&&!gym.has(days[i])&&!ms.has(days[i])){ms.add(days[i]);sf--}}}
return ms}
function nextSess(){const td=new Date(),g=ymd(td),done=ended().some(s=>ymd(s.start)==g);
for(let i=done?1:0;i<8;i++){const x=new Date(td);x.setDate(x.getDate()+i);const r=D.r.filter(r=>r.mode=='days'&&r.days.includes(x.getDay()));
if(r.length)return(i==0?'Today':i==1?'Tomorrow':DN[x.getDay()])+': '+r.map(r=>r.name).join(', ')}
const w=D.r.filter(r=>r.mode=='week');if(w.length){const m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7));m.setHours(0,0,0,0);
const n=ended().filter(s=>s.start>=m).length,t=w.reduce((a,r)=>a+r.n,0);return Math.max(0,t-n)+' more this week'}
return'No goal set'}
function chk(){const a=act();if(a&&Date.now()-(a.last||a.start)>36e5){if(a.last){a.end=a.last;put('s',a)}else{D.s=D.s.filter(s=>s!=a);rm('s',a.id)}return true}}
/* ---------- views ---------- */
function home(){const l=ended()[0],ms=miss(),td=ymd(new Date()),gym=new Set(ended().map(s=>ymd(s.start))),T=Object.fromEntries(D.t.map(t=>[t.d,t]));
const m=new Date();m.setDate(1);m.setMonth(m.getMonth()+cm);const Y=m.getFullYear(),M=m.getMonth(),n=new Date(Y,M+1,0).getDate(),o=(m.getDay()+6)%7;
let cal=['M','T','W','T','F','S','S'].map(x=>`<div class=h>${x}</div>`).join('')+'<div class=e></div>'.repeat(o);
for(let d=1;d<=n;d++){const k=ymd(new Date(Y,M,d)),t=T[k];cal+=`<div onclick="sel='${k}';R()" class="${gym.has(k)?'g':ms.has(k)?'m':''} ${k==td?'t':''}">${d}<b>${gym.has(k)?'✓':ms.has(k)?'✗':''}${t?ST[t.st]:''}</b></div>`}
const ds=l?Math.floor((pd(td)-pd(ymd(l.start)))/864e5):null;
const ts=D.t.find(t=>t.d==sel);
return`<div class=stats><div class=c><span class=sm>LAST SESSION</span><div>${l?esc(l.name):'—'}</div><span class=sm>${l?ymd(l.start):''}</span></div>
<div class=c><span class=sm>DAYS SINCE</span><div class=big>${ds??'—'}</div></div></div>
<div class=c style="margin-top:18px;background:var(--b)"><span class=sm>NEXT SCHEDULED</span><div>${esc(nextSess())}</div></div>
<div class=c><div class=row style="align-items:center"><button class=btn onclick="cm--;R()">◀</button><h2 style="text-align:center;margin:0">${m.toLocaleString('en',{month:'long'})} ${Y}</h2><button class=btn onclick="cm++;R()">▶</button></div>
<div class=cal style="margin-top:8px">${cal}</div>
<p class=lg style="margin-top:8px"><span>🟩 ✓ Gym</span><span>🟪 ✗ Missed</span><span>⬜ Rest</span></p></div>
<div class=c><h2>How was ${sel}?</h2><p class=sm>Tap a calendar day, then log why you missed or what was going on. No guilt.</p>
<select id=st>${Object.entries(ST).map(([k,v])=>`<option value=${k} ${ts?.st==k?'selected':''}>${v} ${k}</option>`).join('')}</select>
<input id=sn placeholder="Note (optional)" value="${esc(ts?.note)}"><button class=btn onclick="saveSt()">SAVE</button>${ts?`<button class="btn pk" onclick="delSt()">CLEAR</button>`:''}</div>
<div class=c><h2>History</h2>${ended().slice(0,30).map(s=>{const sets=s.ex.reduce((a,e)=>a+e.sets.filter(x=>x.d).length,0);return`<div class=hr><span>${ymd(s.start)} · ${esc(s.name)}</span><span>${Math.max(1,Math.round((s.end-s.start)/6e4))} min · ${sets} sets</span></div>`}).join('')||'<p class=sm>No sessions yet. Go lift something.</p>'}</div>`}
async function saveSt(){await put('t',{d:sel,st:$('#st').value,note:$('#sn').value});await load();R()}
async function delSt(){await rm('t',sel);await load();R()}
function train(){const a=act();if(a)return sess(a);
return`<div class=c><h2>My Routines</h2>${D.r.map(r=>`<div class=hr style="display:block"><b>${esc(r.name)}</b><div class=sm>${r.ex.map(e=>esc(e.n)).join(' · ')}<br>Goal: ${r.mode=='days'?r.days.map(d=>DN[d]).join(', '):r.n+'× per week'}</div>
<button class=btn onclick="startR('${r.id}')">▶ START</button><button class="btn pk" onclick="delR('${r.id}')">DELETE</button></div>`).join('')||'<p class=sm>No routines yet. Create one below.</p>'}</div>
<div class=c><h2>New Routine</h2><input id=rn placeholder="Name e.g. Push Day">
<textarea id=re rows=5 placeholder="One exercise per line. Optional sets: Bench Press:4"></textarea>
<select id=rm onchange="$('#rd').hidden=this.value!='days';$('#rx').hidden=this.value!='week'"><option value=days>Specific days of the week</option><option value=week>X times per week</option><option value=none>No goal</option></select>
<div id=rd class=days>${[1,2,3,4,5,6,0].map(d=>`<label><input type=checkbox value=${d}>${DN[d]}</label>`).join('')}</div>
<input id=rx type=number min=1 max=7 value=3 hidden><button class=btn onclick="addR()">SAVE ROUTINE</button></div>`}
async function addR(){const name=$('#rn').value.trim(),ex=$('#re').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const[n,s]=x.split(':');return{n:n.trim(),s:+s||3}});
if(!name||!ex.length)return alert('Add a name and at least one exercise');const mode=$('#rm').value;
await put('r',{id:uid(),name,ex,mode,days:[...document.querySelectorAll('#rd input:checked')].map(i=>+i.value),n:+$('#rx').value||3,c:Date.now()});await load();R()}
async function delR(id){if(confirm('Delete routine? History is kept.')){await rm('r',id);await load();R()}}
async function startR(id){const r=D.r.find(r=>r.id==id),s={id:uid(),rid:id,name:r.name,start:Date.now(),end:null,last:null,ex:r.ex.map(e=>({n:e.n,sets:mk(e.n,e.s)}))};await put('s',s);await load();R()}
function sess(a){return`<div class=c style="background:var(--p)"><h2>${esc(a.name)}</h2><span class=sm>Started ${new Date(a.start).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · auto-ends after 1h with no logged set</span></div>`+
a.ex.map((e,i)=>`<div class=c><h2>${esc(e.n)}</h2><div class=row><button class=btn onclick="swap(${i})">⇄ SWAP</button><button class="btn pk" onclick="rmEx(${i})">✕ REMOVE</button></div>
${e.sets.map((s,j)=>`<div class=set><span>${j+1}</span><input type=number inputmode=decimal placeholder="kg" value="${s.w}" oninput="sv(${i},${j},'w',this.value)"><input type=number inputmode=numeric placeholder="reps" value="${s.r}" oninput="sv(${i},${j},'r',this.value)">
<select onchange="sv(${i},${j},'b',this.value)">${BARS.map(b=>`<option ${s.b==b?'selected':''}>${b}</option>`).join('')}</select><button class="${s.d?'done':''}" onclick="tg(${i},${j})">✓</button></div>${s.p?`<div class=sm style="margin:-2px 0 4px 26px">last time: ${s.p}</div>`:''}`).join('')}
<button class=btn onclick="addSet(${i})">+ SET</button></div>`).join('')+
`<button class="btn bl" onclick="addEx()">+ ADD EXERCISE</button><button class="btn" style="width:100%;font-size:18px;padding:14px" onclick="fin()">✔ COMPLETE SESSION</button><button class="btn pk" onclick="disc()">DISCARD</button>`}
const sv=(i,j,f,v)=>{const a=act();a.ex[i].sets[j][f]=v;put('s',a)};
function tg(i,j){const a=act(),s=a.ex[i].sets[j];s.d=!s.d;if(s.d)a.last=Date.now();put('s',a);R()}
function addSet(i){const a=act(),s=a.ex[i].sets,l=s[s.length-1]||{};s.push({w:l.w??'',r:l.r??'',b:l.b||'Normal',d:false,p:''});put('s',a);R()}
function swap(i){const n=prompt('Swap for which exercise? (this session only)');if(n){const a=act();a.ex[i]={n:n.trim(),sets:mk(n.trim(),3)};put('s',a);R()}}
function addEx(){const n=prompt('Exercise name? (this session only)');if(n){const a=act();a.ex.push({n:n.trim(),sets:mk(n.trim(),3)});put('s',a);R()}}
function rmEx(i){const a=act();a.ex.splice(i,1);put('s',a);R()}
async function fin(){const a=act();a.end=a.last||Date.now();if(!a.ex.some(e=>e.sets.some(s=>s.d))){if(!confirm('No sets ticked. Discard session?'))return;return disc(1)}await put('s',a);await load();tab='home';R()}
async function disc(f){if(f||confirm('Discard this session?')){await rm('s',act().id);await load();R()}}
function stats(){const names=[...new Set(D.s.flatMap(s=>s.ex.map(e=>e.n)))];if(!sx||!names.includes(sx))sx=names[0]||'';
setTimeout(()=>{const pts=ended().reverse().map(s=>{const e=s.ex.find(e=>e.n==sx),d=e?e.sets.filter(x=>x.d):[];return d.length?{w:Math.max(...d.map(x=>+x.w||0)),r:d.reduce((a,x)=>a+(+x.r||0),0)}:null}).filter(Boolean);ch('#c1',pts.map(p=>p.w),'#FF6B9D');ch('#c2',pts.map(p=>p.r),'#8EC5FF')},0);
return names.length?`<div class=c><h2>Exercise</h2><select onchange="sx=this.value;R()">${names.map(n=>`<option ${n==sx?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
<div class=c><h2>Top weight per session</h2><canvas id=c1></canvas><h2>Total reps per session</h2><canvas id=c2></canvas></div>`:'<div class=c>Finish a session to see progress graphs.</div>'}
function ch(id,v,col){const e=$(id);if(!e)return;const W=e.width=e.clientWidth*2,H=e.height=360,x=e.getContext('2d'),mx=Math.max(...v,1),mn=Math.min(...v,0),p=36,X=i=>p+(v.length>1?i*(W-2*p)/(v.length-1):(W-2*p)/2),Y=y=>H-p-(y-mn)/((mx-mn)||1)*(H-2*p);
x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#111';x.fillStyle='#111';x.font='bold 24px sans-serif';x.lineWidth=6;x.beginPath();v.forEach((y,i)=>i?x.lineTo(X(i),Y(y)):x.moveTo(X(i),Y(y)));x.stroke();
v.forEach((y,i)=>{x.fillStyle=col;x.fillRect(X(i)-10,Y(y)-10,20,20);x.strokeRect(X(i)-10,Y(y)-10,20,20);x.fillStyle='#111';x.fillText(y,X(i)-10,Y(y)-18)})}
function body(){const t=B.cal?`<div class=c style="background:var(--g)"><h2>Your targets</h2><div class=big>${B.cal} kcal</div><div class=big>${B.pro} g protein</div><p class=sm>Maintenance ≈ ${B.tdee} kcal. Estimates only, adjust based on how you feel and your trend.</p></div>`:'';
return t+`<div class=c><h2>Body & Goal</h2><div class=row><input id=ba type=number placeholder="Age" value="${B.a||''}"><select id=bs><option value=m ${B.sx=='m'?'selected':''}>Male</option><option value=f ${B.sx=='f'?'selected':''}>Female</option></select></div>
<div class=row><input id=bw type=number step=.1 placeholder="Weight kg" value="${B.w||''}"><input id=bh type=number placeholder="Height cm" value="${B.h||''}"></div>
<select id=bl>${[[1.2,'Sedentary'],[1.375,'Light (1-3 days)'],[1.55,'Moderate (3-5 days)'],[1.725,'Very active (6-7 days)'],[1.9,'Athlete / physical job']].map(([v,l])=>`<option value=${v} ${B.al==v?'selected':''}>${l}</option>`).join('')}</select>
<select id=bg>${['maintain','cut','bulk'].map(g=>`<option ${B.g==g?'selected':''}>${g}</option>`).join('')}</select><button class=btn onclick="calc()">CALCULATE</button></div>`}
async function calc(){const a=+$('#ba').value,w=+$('#bw').value,h=+$('#bh').value,s=$('#bs').value,al=+$('#bl').value,g=$('#bg').value;if(!a||!w||!h)return alert('Fill in age, weight and height');
const tdee=Math.round((10*w+6.25*h-5*a+(s=='m'?5:-161))*al);B={key:'body',a,w,h,sx:s,al,g,tdee,cal:tdee+(g=='cut'?-450:g=='bulk'?300:0),pro:Math.round(w*(g=='cut'?2.2:g=='bulk'?1.8:1.6))};await put('k',B);R()}
function meals(){const l=D.m.filter(x=>x.date==md),p=l.reduce((a,x)=>a+(+x.p||0),0),c=l.reduce((a,x)=>a+(+x.c||0),0);
const bar=(v,t,n)=>`<div class=sm>${n}: ${v}${t?' / '+t:''}</div>${t?`<div class=bar><i style="width:${Math.min(100,v/t*100)}%"></i></div>`:''}`;
return`<div class=c><input type=date value="${md}" onchange="md=this.value;R()"><h2 style="margin-top:8px">Today so far</h2>${bar(p,B.pro,'Protein g')}<br>${bar(c,B.cal,'Calories')}<p class=sm style="margin-top:8px">Any log counts. Just protein? Just calories? Both fine. Progress over perfection 💛</p></div>
<div class=c><h2>Add</h2><input id=mn placeholder="What was it? (optional)"><div class=row><input id=mp type=number inputmode=numeric placeholder="Protein g"><input id=mc type=number inputmode=numeric placeholder="Calories"></div><button class=btn onclick="addM()">LOG IT</button></div>
<div class=c>${l.map(x=>`<div class=hr><span>${esc(x.n)||'Entry'}</span><span>${x.p?x.p+'g ':''}${x.c?x.c+'kcal ':''}<a href=# onclick="delM('${x.id}');return false">✕</a></span></div>`).join('')||'<p class=sm>Nothing logged yet.</p>'}</div>`}
async function addM(){const p=$('#mp').value,c=$('#mc').value;if(!p&&!c)return alert('Enter protein or calories (either is fine)');await put('m',{id:uid(),date:md,n:$('#mn').value,p,c});await load();R()}
async function delM(id){await rm('m',id);await load();R()}
const TABS=[['home','🏠','HOME',home],['train','💪','TRAIN',train],['stats','📈','STATS',stats],['body','⚖️','BODY',body],['meals','🍗','MEALS',meals]];
function R(){$('#v').innerHTML=TABS.find(t=>t[0]==tab)[3]();$('#n').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';R();scrollTo(0,0)">${t[1]}<br>${t[2]}</button>`).join('')}
(async()=>{db=await op();await load();chk();R();setInterval(async()=>{if(chk()){await load();R()}},6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&chk()){load().then(R)}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
